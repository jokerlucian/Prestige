<script>
  var images = [];
  var currentIndex = 0;

  var overlay = document.getElementById('lbOverlay');
  var lbImg = document.getElementById('lbImg');
  var lbCounter = document.getElementById('lbCounter');
  var lbClose = document.getElementById('lbClose');
  var lbLeft = document.getElementById('lbLeft');
  var lbRight = document.getElementById('lbRight');

  function openLightbox(index) {
    currentIndex = index;
    lbImg.src = images[currentIndex];
    lbCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
    overlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    overlay.style.display = 'none';
    document.body.style.overflow = 'auto';
  }

  function moveLight(dir) {
    currentIndex = (currentIndex + dir + images.length) % images.length;
    lbImg.src = images[currentIndex];
    lbCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
  }

  lbClose.onclick = closeLightbox;
  lbLeft.onclick = function(e) { e.stopPropagation(); moveLight(-1); };
  lbRight.onclick = function(e) { e.stopPropagation(); moveLight(1); };
  overlay.onclick = function(e) { if (e.target === overlay) closeLightbox(); };

  document.addEventListener('keydown', function(e) {
    if (overlay.style.display !== 'flex') return;
    if (e.key === 'ArrowLeft') moveLight(-1);
    if (e.key === 'ArrowRight') moveLight(1);
    if (e.key === 'Escape') closeLightbox();
  });

  var touchStartX = 0;
  overlay.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  overlay.addEventListener('touchend', function(e) {
    var diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) moveLight(diff > 0 ? 1 : -1);
  }, { passive: true });

  function initGallery() {
    var items = document.querySelectorAll('.gallery-item');
    items.forEach(function(item, index) {
      var img = item.querySelector('img');
      images.push(item.getAttribute("data-full")||img.src);

      var startY = 0;
      var startX = 0;
      var moved = false;

      item.addEventListener('touchstart', function(e) {
        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
        moved = false;
      }, { passive: true });

      item.addEventListener('touchmove', function(e) {
        if (Math.abs(e.touches[0].clientY - startY) > 10 || Math.abs(e.touches[0].clientX - startX) > 10) {
          moved = true;
        }
      }, { passive: true });

      item.addEventListener('touchend', function(e) {
        if (!moved) {
          openLightbox(index);
        }
      }, { passive: true });

      item.onclick = function() { openLightbox(index); };
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGallery);
  } else {
    initGallery();
  }
</script>
</body>
</html>
